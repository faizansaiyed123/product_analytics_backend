[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP007", "UP038", "UP031", "B905", "B904"]
[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "I", "UP"]
"tests/*" = ["B"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["_unattributed_drafts"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []
