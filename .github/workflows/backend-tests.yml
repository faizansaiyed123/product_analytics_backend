name: Backend API and PostgreSQL tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://analytics:analytics@127.0.0.1:5432/analytics_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: backend-ci-jwt-secret-0123456789-abcdef
      API_KEY_SECRET: backend-ci-api-key-secret-0123456789
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PUBLIC_APP_URL: http://localhost:5173
      EXPORT_DIR: /tmp/product-analytics-exports

    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply real PostgreSQL migrations
        run: alembic upgrade head

      - name: Run backend API, database, auth, ingestion and analytics tests
        run: python -m pytest -q
